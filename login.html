<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daura Admin Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f2e9;font-family:Inter,Arial;color:#17120b}.box{width:min(410px,calc(100% - 30px));background:#fff;padding:28px;border-radius:20px;box-shadow:0 10px 35px #0002}h1{margin:0;color:#b48a00}.sub{color:#777;margin:5px 0 22px}label{font-weight:700;font-size:14px}input{width:100%;padding:13px;margin:7px 0 15px;border:1px solid #ddd;border-radius:10px;font-size:16px}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#17120b;color:#ffd21a;font-weight:800;font-size:16px;cursor:pointer}.error{color:#d21c14;min-height:20px;margin-bottom:10px}.hint{font-size:12px;color:#777;margin-top:15px}</style></head><body><div class="box"><h1>DAURA</h1><div class="sub">Restaurant Admin Login</div><form id="f"><label>Username</label><input id="u" autocomplete="username" required><label>Password</label><input id="p" type="password" autocomplete="current-password" required><div class="error" id="e"></div><button class="btn">LOGIN</button></form><div class="hint">Admin authentication is handled by Supabase Auth.</div></div><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient(DAURA_SUPABASE_URL,DAURA_SUPABASE_KEY);f.onsubmit=async ev=>{ev.preventDefault();e.textContent='';let username=u.value.trim(),password=p.value;let email=username.includes('@')?username:username+'@daura.local';let {error}=await db.auth.signInWithPassword({email,password});if(error){e.textContent='Invalid username or password.';return}location.href='admin.html'}</script></body></html>
