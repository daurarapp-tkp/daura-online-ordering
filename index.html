<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daura Restaurant & Party Palace — Order Online</title><style>body{font-family:Arial,sans-serif;margin:0;background:#faf8f2;color:#17120b}header{background:#17120b;color:#ffd21a;padding:18px;text-align:center;font-weight:800}.hero{text-align:center;padding:45px 18px;background:#f4c400}.hero h1{margin:0 0 8px}.wrap{max-width:1000px;margin:auto;padding:25px 16px 110px}.search{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px}.cats{display:flex;gap:8px;overflow:auto;padding:14px 0}.cat{white-space:nowrap;border:1px solid #ddd;background:white;border-radius:99px;padding:9px 13px}.cat.on{background:#17120b;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.card{background:#fff;border:1px solid #eee;border-radius:16px;padding:14px}.tag{font-size:11px;color:#9a7600;text-transform:uppercase;font-weight:bold}.name{font-weight:800;margin:8px 0}.row{display:flex;justify-content:space-between;align-items:center}.add,.order{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.add{background:#17120b;color:white}.order{background:#e32318;color:white}.bar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:min(650px,calc(100% - 24px));background:#17120b;color:white;padding:12px;border-radius:16px;display:flex;justify-content:space-between;align-items:center}.bar b{color:#ffd21a}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:8px}.card{padding:11px}.name{font-size:14px}}</style></head><body><header>DAURA RESTAURANT & PARTY PALACE<br><small>Taste a food cooked on firewood</small></header><section class="hero"><h1>Order Your Favourite Food</h1><p>Delivery · Pickup · WhatsApp Ordering</p></section><main class="wrap"><input id="search" class="search" placeholder="🔎 Search food..." oninput="render()"><div id="cats" class="cats"> n',450]];let active='All',cart=[];const cats=['All',...new Set(M.map(x=>x[0]))];function init(){catsEl.innerHTML=cats.map(c=>`<button class="cat ${c==active?'on':''}" onclick="active='${c}';init();render()">${c}</button>`).join('')}function render(){let q=search.value.toLowerCase();grid.innerHTML=M.filter(x=>(active=='All'||x[0]==active)&&x[1].toLowerCase().includes(q)).map(x=>`<div class="card"><div class="tag">${x[0]}</div><div class="name">${x[1]}</div><div class="row"><b>Rs. ${x[2]}</b><button class="add" onclick="add('${x[1]}',${x[2]})">ADD</button></div></div>`).join('')}function add(n,p){let x=cart.find(i=>i.n==n);x?x.q++:cart.push({n,q:1,p});update()}function update(){count.textContent=cart.reduce((a,x)=>a+x.q,0);total.textContent=cart.reduce((a,x)=>a+x.q*x.p,0)}function checkout(){if(!cart.length)return alert('Please add food first.');let msg='*DAURA RESTAURANT & PARTY PALACE*\n\n*NEW ONLINE ORDER*\n';cart.forEach(x=>msg+=`• ${x.n} × ${x.q} = Rs. ${x.q*x.p}\n`);msg+=`\n*TOTAL: Rs. ${cart.reduce((a,x)=>a+x.q*x.p,0)}*\n\nPlease confirm my order.`;location.href='https://wa.me/9779744444442?text='+encodeURIComponent(msg)}const catsEl=document.getElementById('cats');init();render();update();</script></body></html>
