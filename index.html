<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4c400"><title>Daura Restaurant & Party Palace — Order Online</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#faf8f2;color:#18140e}header{background:#17120b;color:#fff;position:sticky;top:0;z-index:20}.nav{max-width:1150px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px}.logo{width:54px;height:54px;border-radius:50%;background:#fff}.brand b{display:block;color:#ffd21a;font-size:18px}.brand small{color:#ddd}.hero{background:linear-gradient(135deg,#ffd925,#f1b900);padding:32px 16px;text-align:center}.hero h1{margin:0 0 8px;font-size:34px}.wrap{max-width:1150px;margin:auto;padding:20px 16px 115px}.search{width:100%;padding:14px;border:1px solid #ddd;border-radius:13px;font-size:16px}.cats{display:flex;gap:8px;overflow:auto;padding:14px 0;position:sticky;top:74px;background:#faf8f2;z-index:10}.cat{white-space:nowrap;border:1px solid #ddd;background:#fff;border-radius:99px;padding:9px 13px}.cat.on{background:#17120b;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:13px}.card{background:#fff;border:1px solid #eee;border-radius:18px;padding:14px}.tag{font-size:10px;text-transform:uppercase;color:#a47c00;font-weight:800}.name{font-weight:800;margin:7px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.price{font-weight:900;font-size:18px}.add{background:#17120b;color:#fff;border:0;border-radius:10px;padding:9px 12px;font-weight:800}.bar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:min(680px,calc(100% - 22px));background:#17120b;color:#fff;padding:11px 13px;border-radius:18px;display:flex;justify-content:space-between;align-items:center;z-index:30;box-shadow:0 8px 30px #0006}.bar strong{color:#ffd21a}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:40;padding:16px;overflow:auto}.sheet{max-width:650px;margin:15px auto;background:#fff;border-radius:22px;padding:20px}.close{float:right;border:0;border-radius:50%;width:32px;height:32px}.line{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eee}.qty button{width:28px;height:28px;border:0;border-radius:7px}.total{text-align:right;font-size:20px;font-weight:900;margin:15px 0}input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:5px 0 12px;font:inherit}.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pay label{border:1px solid #ddd;border-radius:10px;padding:10px}.notice{background:#fff7d5;border-left:4px solid #f5c400;padding:10px;border-radius:7px;font-size:13px}@media(max-width:600px){.hero h1{font-size:27px}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.card{padding:11px}.name{font-size:14px}.price{font-size:16px}}</style></head><body><header><div class="nav"><img class="logo" src="logo.png" alt="Daura"><div class="brand"><b>Daura Restaurant & Party Palace</b><small>Taste a food cooked on firewood</small></div></div></header><section class="hero"><h1>Order Food Online</h1><p>Freshly prepared · Delivery · Pickup</p></section><main class="wrap"><input id="search" class="search" placeholder="🔎 Search food..." oninput="render()"><div id="cats" class="cats"></div><div id="grid" class="grid"></div></main><div class="bar"><span>🛒 <strong id="count">0</strong> · Rs. <strong id="sum">0</strong></span><button class="add" onclick="openCart()">VIEW CART</button></div><div id="modal" class="modal"><div class="sheet"><button class="close" onclick="closeCart()">×</button><h2>Your Order</h2><div id="lines"></div><div class="total">Total: Rs. <span id="total">0</span></div><div class="notice">Your order is saved to Daura's online order database. WhatsApp confirmation is also available.</div><label>Order Type</label><select id="type"><option>Delivery</option><option>Pickup</option></select><label>Name *</label><input id="name" placeholder="Your name"><label>Mobile *</label><input id="phone" placeholder="98XXXXXXXX"><label>Address</label><textarea id="address" rows="2" placeholder="Delivery address"></textarea><label>Payment</label><div class="pay"><label><input type="radio" name="pay" value="Cash on Delivery" checked> Cash on Delivery</label><label><input type="radio" name="pay" value="eSewa"> eSewa</label><label><input type="radio" name="pay" value="Khalti"> Khalti</label><label><input type="radio" name="pay" value="Pay at Pickup"> Pay at Pickup</label></div><label>Special instructions</label><textarea id="note" rows="2" placeholder="Less spicy, no onion, etc."></textarea><button class="add" style="width:100%;margin-top:8px" onclick="placeOrder()">CONFIRM ORDER</button></div></div><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="menu.js"></script><script>const db=supabase.createClient(DAURA_SUPABASE_URL,DAURA_SUPABASE_KEY);let active='All',cart=[];const cats=['All',...new Set(DAURA_MENU.map(x=>x[0]))];function rs(n){return n.toLocaleString('en-IN')}function initCats(){catsEl.innerHTML=cats.map(c=>`<button class="cat ${c==active?'on':''}" onclick="active='${c}';initCats();render()">${c}</button>`).join('')}function render(){let q=search.value.toLowerCase();grid.innerHTML=DAURA_MENU.filter(x=>(active=='All'||x[0]==active)&&x[1].toLowerCase().includes(q)).map(x=>`<div class="card"><div class="tag">${x[0]}</div><div class="name">${x[1]}</div><div class="row"><span class="price">Rs. ${rs(x[2])}</span><button class="add" onclick="addItem('${x[1].replaceAll("'","\\'")}',${x[2]})">ADD</button></div></div>`).join('')}function addItem(name,price){let x=cart.find(i=>i.name==name);x?x.qty++:cart.push({name,price,qty:1});updateBar()}function updateBar(){count.textContent=cart.reduce((s,x)=>s+x.qty,0);sum.textContent=rs(cart.reduce((s,x)=>s+x.price*x.qty,0))}function openCart(){modal.style.display='block';lines.innerHTML=cart.length?cart.map(x=>`<div class="line"><span>${x.name}<br><small>Rs. ${rs(x.price)} × ${x.qty}</small></span><span class="qty"><button onclick="changeQty('${x.name.replaceAll("'","\\'")}',-1)">−</button> ${x.qty} <button onclick="changeQty('${x.name.replaceAll("'","\\'")}',1)">+</button></span></div>`).join(''):'<p>Your cart is empty.</p>';total.textContent=rs(cart.reduce((s,x)=>s+x.price*x.qty,0))}function closeCart(){modal.style.display='none'}function changeQty(name,d){let x=cart.find(i=>i.name==name);if(!x)return;x.qty+=d;if(x.qty<=0)cart=cart.filter(i=>i!==x);openCart();updateBar()}async function placeOrder(){try{if(!cart.length)return alert('Please add food first.');let customer_name=document.getElementById('name').value.trim(),phoneNo=document.getElementById('phone').value.trim(),orderType=document.getElementById('type').value;if(!customer_name||!phoneNo)return alert('Please enter name and mobile number.');if(orderType==='Delivery'&&!document.getElementById('address').value.trim())return alert('Please enter delivery address.');let order={customer_name,phone:phoneNo,order_type:orderType,address:document.getElementById('address').value.trim(),payment_method:document.querySelector('input[name=pay]:checked').value,items:cart,total:cart.reduce((s,x)=>s+x.price*x.qty,0),special_instructions:document.getElementById('note').value.trim(),status:'New'};let result=await db.from('orders').insert(order);if(result.error){console.error('Supabase order error:',result.error);alert('Order failed: '+result.error.message+'\n\nIf this says table, policy, or permission error, run supabase-schema.sql in Supabase SQL Editor.');return}let msg='*DAURA RESTAURANT & PARTY PALACE*\n\n*NEW ONLINE ORDER*\n';cart.forEach(x=>msg+='• '+x.name+' × '+x.qty+' = Rs. '+(x.price*x.qty)+'\n');msg+='\n*TOTAL: Rs. '+order.total+'*\nName: '+customer_name+'\nMobile: '+phoneNo+'\nOrder: '+orderType;if(order.address)msg+='\nAddress: '+order.address;if(order.special_instructions)msg+='\nNote: '+order.special_instructions;window.open('https://wa.me/'+DAURA_WHATSAPP+'?text='+encodeURIComponent(msg),'_blank');alert('Order received successfully!');cart=[];updateBar();closeCart()}catch(e){console.error('Order exception:',e);alert('Order failed: '+(e.message||e));}}const catsEl=document.getElementById('cats');initCats();render();updateBar();</script></body></html>
