<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daura Admin Panel</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f5f2e9;color:#17120b}header{background:#17120b;color:#fff;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}header b{color:#ffd21a}.wrap{max-width:1100px;margin:auto;padding:20px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border-radius:14px;padding:18px}.stat b{font-size:25px}.panel{background:#fff;border-radius:15px;padding:18px;margin-top:15px}.order{border:1px solid #eee;border-radius:12px;padding:14px;margin:10px 0}.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}.gold{background:#ffd21a}.red{background:#e32318;color:#fff}.muted{color:#777}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}} </style></head><body><header><b>DAURA ADMIN PANEL</b><span>Restaurant Orders</span></header><main class="wrap"><div class="cards"><div class="stat">New<br><b id="new">0</b></div><div class="stat">Accepted<br><b id="accepted">0</b></div><div class="stat">Preparing<br><b id="preparing">0</b></div><div class="stat">Completed<br><b id="completed">0</b></div></div><div class="panel"><button class="btn gold" onclick="load()">Refresh</button> <button class="btn red" onclick="clearOrders()">Clear Orders</button><p class="muted">This starter panel reads orders stored in this browser. WhatsApp orders do not automatically appear here; a real shared admin dashboard requires a backend/database.</p></div><div id="orders"></div></main><script>const states=['New','Accepted','Preparing','Ready','Delivered'];function load(){let a=JSON.parse(localStorage.getItem('dauraOrders')||'[]');let c={New:0,Accepted:0,Preparing:0,Delivered:0};a.forEach(o=>{if(o.status==='Delivered')c.Delivered++;else c[o.status||'New']=(c[o.status||'New']||0)+1});newEl.textContent=c.New||0;accepted.textContent=c.Accepted||0;preparing.textContent=c.Preparing||0;completed.textContent=c.Delivered||0;orders.innerHTML=a.length?a.map((o,i)=>`<div class="order"><b>#${i+1} · ${o.name}</b><p>${o.items.map(x=>x.name+' × '+x.qty).join('<br>')}</p><b>Rs. ${o.total}</b><p>${o.type} · ${o.payment}<br>${o.phone}<br>${o.address||''}</p><button class="btn gold" onclick="advance(${i})">${o.status||'New'} → Next</button></div>`).join(''):'<div class="panel">No local orders.</div>'}function advance(i){let a=JSON.parse(localStorage.getItem('dauraOrders')||'[]'),n=states.indexOf(a[i].status||'New');a[i].status=states[Math.min(n+1,states.length-1)];localStorage.setItem('dauraOrders',JSON.stringify(a));load()}function clearOrders(){if(confirm('Clear all local orders?')){localStorage.removeItem('dauraOrders');load()}}load();</script></body></html>
