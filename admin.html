<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daura Admin Panel</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f5f2e9;color:#17120b}header{background:#17120b;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}header b{color:#ffd21a}.wrap{max-width:1100px;margin:auto;padding:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel,.order{background:#fff;border-radius:14px;padding:16px}.stat b{font-size:26px}.panel{margin-top:15px}.order{margin:10px 0;border:1px solid #eee}.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}.gold{background:#ffd21a}.status{display:inline-block;padding:6px 9px;border-radius:8px;background:#eee;margin-right:8px}.muted{color:#777}.new{border-left:5px solid #e32318}.items{line-height:1.7}.itemline{display:flex;justify-content:space-between;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{text-align:center;padding:35px;color:#777}.error{color:#b00020;font-weight:700}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}header span{display:none}}</style></head><body><header><b>DAURA ADMIN PANEL</b><span>Live Orders · Supabase</span><button class="btn gold" onclick="logout()">Logout</button></header><main class="wrap"><div class="stats"><div class="stat">New<br><b id="sNew">0</b></div><div class="stat">Accepted<br><b id="sAccepted">0</b></div><div class="stat">Preparing<br><b id="sPreparing">0</b></div><div class="stat">Completed<br><b id="sDone">0</b></div></div><div class="panel"><button class="btn gold" onclick="loadOrders()">Refresh</button> <span id="connection" class="muted">Connecting...</span></div><div id="orders"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const db=supabase.createClient(DAURA_SUPABASE_URL,DAURA_SUPABASE_KEY);const states=['New','Accepted','Preparing','Ready','Delivered'];const statusMap={pending:'New',Pending:'New',new:'New',New:'New',accepted:'Accepted',Accepted:'Accepted',preparing:'Preparing',Preparing:'Preparing',ready:'Ready',Ready:'Ready',delivered:'Delivered',Delivered:'Delivered'};async function guard(){const {data,error}=await db.auth.getSession();if(error||!data.session){location.href='login.html';return false}return true}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function fmt(n){const v=Number(n);return Number.isFinite(v)?v.toLocaleString('en-IN',{maximumFractionDigits:2}):'0'}function normalizeStatus(s){return statusMap[s]||'New'}function itemQty(x){const q=Number(x?.quantity ?? x?.qty ?? 1);return Number.isFinite(q)&&q>0?q:1}function itemPrice(x){const p=Number(x?.price ?? 0);return Number.isFinite(p)?p:0}function itemAmount(x){const sub=Number(x?.subtotal);return Number.isFinite(sub)?sub:itemPrice(x)*itemQty(x)}function itemLines(items){if(!Array.isArray(items))return '<span class="error">No item data</span>';return items.map(x=>`<div class="itemline"><span>${esc(x?.name||'Unknown item')} × ${itemQty(x)}</span><b>Rs. ${fmt(itemAmount(x))}</b></div>`).join('')}async function loadOrders(){if(!await guard())return;const {data,error}=await db.from('orders').select('*').order('created_at',{ascending:false});if(error){connection.textContent='Database error: '+error.message;console.error(error);return}connection.textContent='● Live database connected';const c={New:0,Accepted:0,Preparing:0,Ready:0,Delivered:0};data.forEach(o=>{const s=normalizeStatus(o.status);c[s]=(c[s]||0)+1});sNew.textContent=c.New;sAccepted.textContent=c.Accepted;sPreparing.textContent=c.Preparing;sDone.textContent=c.Delivered;orders.innerHTML=data.length?data.map(o=>{const s=normalizeStatus(o.status);const i=states.indexOf(s);const next=i<states.length-1?states[i+1]:null;const amount=Number(o.total_amount??o.total??0);return `<div class="order ${s==='New'?'new':''}"><div><b>#${o.id} · ${esc(o.customer_name)}</b> <span class="status">${esc(s)}</span></div><div class="items">${itemLines(o.items)}</div><p><b>Rs. ${fmt(amount)}</b> · ${esc(o.order_type)} · ${esc(o.payment_method||'')}</p><p>📞 ${esc(o.customer_phone||o.phone||'')}<br>📍 ${esc(o.address||'No address')}<br><small>${new Date(o.created_at).toLocaleString()}</small></p><div class="actions">${next?`<button class="btn gold" onclick="advance(${o.id},'${s}')">Move to ${next}</button>`:'<button class="btn" disabled>Delivered</button>'}</div></div>`}).join(''):'<div class="empty">No orders yet.</div>'}async function advance(id,status){const current=normalizeStatus(status);const i=states.indexOf(current);if(i<0||i>=states.length-1)return;const next=states[i+1];connection.textContent='Updating order #'+id+'...';const {data,error}=await db.from('orders').update({status:next}).eq('id',id).select('id,status').single();if(error){connection.textContent='Update failed: '+error.message;alert('Could not update order status.\n\n'+error.message);return}if(!data||normalizeStatus(data.status)!==next){connection.textContent='Update returned no matching order';alert('Order status was not changed. Check admin login/RLS permissions.');return}await loadOrders()}async function logout(){await db.auth.signOut();location.href='login.html'}db.channel('daura-orders-admin').on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>loadOrders()).subscribe((status)=>{if(status==='SUBSCRIBED')connection.textContent='● Live database connected'});loadOrders();</script></body></html>
