<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daura Admin Panel</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f5f2e9;color:#17120b}header{background:#17120b;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}header b{color:#ffd21a}.wrap{max-width:1100px;margin:auto;padding:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel,.order{background:#fff;border-radius:14px;padding:16px}.stat b{font-size:26px}.panel{margin-top:15px}.order{margin:10px 0;border:1px solid #eee}.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}.gold{background:#ffd21a}.red{background:#e32318;color:#fff}.status{display:inline-block;padding:6px 9px;border-radius:8px;background:#eee;margin-right:8px}.muted{color:#777}.new{border-left:5px solid #e32318}.items{line-height:1.7}.empty{text-align:center;padding:35px;color:#777}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}header span{display:none}}</style></head><body><header><b>DAURA ADMIN PANEL</b><span>Live Orders · Supabase</span><button class="btn gold" onclick="logout()">Logout</button></header><main class="wrap"><div class="stats"><div class="stat">New<br><b id="sNew">0</b></div><div class="stat">Accepted<br><b id="sAccepted">0</b></div><div class="stat">Preparing<br><b id="sPreparing">0</b></div><div class="stat">Completed<br><b id="sDone">0</b></div></div><div class="panel"><button class="btn gold" onclick="loadOrders()">Refresh</button> <span id="connection" class="muted">Connecting...</span></div><div id="orders"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const db=supabase.createClient(DAURA_SUPABASE_URL,DAURA_SUPABASE_KEY);const states=['New','Accepted','Preparing','Ready','Delivered'];async function guard(){let {data}=await db.auth.getSession();if(!data.session){location.href='login.html';return false}return true}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function fmt(n){return Number(n).toLocaleString('en-IN')}async function loadOrders(){if(!await guard())return;let {data,error}=await db.from('orders').select('*').order('created_at',{ascending:false});if(error){connection.textContent='Database error';console.error(error);return}connection.textContent='● Live database connected';let c={New:0,Accepted:0,Preparing:0,Delivered:0};data.forEach(o=>{let s=o.status||'New';if(s==='Delivered')c.Delivered++;else c[s]=(c[s]||0)+1});sNew.textContent=c.New;sAccepted.textContent=c.Accepted;sPreparing.textContent=c.Preparing;sDone.textContent=c.Delivered;orders.innerHTML=data.length?data.map(o=>`<div class="order ${o.status==='New'?'new':''}"><div><b>#${o.id} · ${esc(o.customer_name)}</b> <span class="status">${esc(o.status||'New')}</span></div><p class="items">${(o.items||[]).map(x=>`${esc(x.name)} × ${x.qty} — Rs. ${fmt(x.price*x.qty)}`).join('<br>')}</p><p><b>Rs. ${fmt(o.total)}</b> · ${esc(o.order_type)} · ${esc(o.payment_method)}</p><p>📞 ${esc(o.phone)}<br>📍 ${esc(o.address||'No address')}<br><small>${new Date(o.created_at).toLocaleString()}</small></p><button class="btn gold" onclick="advance(${o.id},'${esc(o.status||'New')}')">${o.status==='Delivered'?'Delivered':'Move to '+states[Math.min(states.indexOf(o.status||'New')+1,states.length-1)]}</button></div>`).join(''):'<div class="empty">No orders yet.</div>'}async function advance(id,status){let i=states.indexOf(status);if(i<0||i>=states.length-1)return;let next=states[i+1];let {error}=await db.from('orders').update({status:next}).eq('id',id);if(error)alert('Could not update order');else loadOrders()}async function logout(){await db.auth.signOut();location.href='login.html'}db.channel('daura-orders').on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>loadOrders()).subscribe();loadOrders();</script></body></html>
