<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daura Admin</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f5f2e9;color:#18140e}header{background:#17120b;color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}header b{color:#ffd21a}.wrap{max-width:1100px;margin:auto;padding:20px}.tabs{display:flex;gap:8px;margin-bottom:15px}.tab{padding:10px 15px;border:0;border-radius:10px}.active{background:#17120b;color:#fff}.panel{background:#fff;border-radius:15px;padding:16px;margin-bottom:15px}.order{border:1px solid #eee;border-radius:12px;padding:14px;margin:10px 0}.status{padding:7px;border-radius:8px}.btn{padding:9px 12px;border:0;border-radius:9px;cursor:pointer;font-weight:700}.red{background:#e32318;color:#fff}.gold{background:#ffd21a}.muted{color:#777}</style></head>
<body><header><b>DAURA ADMIN DASHBOARD</b><span>Orders · Menu · Settings</span></header><div class="wrap"><div class="panel"><h2>Restaurant Orders</h2><p class="muted">This starter dashboard stores orders in this browser. For multi-device/live staff use, connect a backend database.</p><button class="btn gold" onclick="clearOrders()">Clear local orders</button></div><div id="orders"></div></div>
<script>
function render(){let a=JSON.parse(localStorage.getItem('dauraOrders')||'[]');document.getElementById('orders').innerHTML=a.length?a.map((o,i)=>`<div class="order"><b>#${i+1} · ${o.name}</b><p>${o.items.map(x=>x.name+' × '+x.qty).join('<br>')}</p><p><b>Rs. ${o.total}</b> · ${o.type} · ${o.payment}</p><p>${o.phone}<br>${o.address||''}</p><button class="btn gold" onclick="status(${i})">${o.status||'New'}</button></div>`).join(''):'<div class="panel">No local orders yet.</div>'}
function status(i){let a=JSON.parse(localStorage.getItem('dauraOrders')||'[]'),s=['New','Accepted','Preparing','Ready','Delivered'];let n=s.indexOf(a[i].status||'New');a[i].status=s[(n+1)%s.length];localStorage.setItem('dauraOrders',JSON.stringify(a));render()}
function clearOrders(){if(confirm('Clear all local orders?')){localStorage.removeItem('dauraOrders');render()}}render();
</script></body></html>
