name: Fix live order checkout
on:
  push:
    paths:
      - 'README.md'
      - 'index.html'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix checkout JavaScript syntax only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          fixed=s.replace('async async function order(){','async function order(){')
          if fixed != s:
              p.write_text(fixed)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix duplicate async syntax without changing menu" || exit 0
          git push
